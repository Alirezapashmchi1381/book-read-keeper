services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: book_keeper
      POSTGRES_PASSWORD: book_keeper
      POSTGRES_DB: book_keeper_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_keeper -d book_keeper_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: bundle/Dockerfile
    env_file:
      - ../.env.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://book_keeper:book_keeper@db:5432/book_keeper_dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
