[project]
name = "book-read-keeper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.22.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "python-dotenv>=1.0.0",
    "alembic",
    "psycopg[binary]>=3.2",

]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
